[project]
name = "ticket-triage-agent"
version = "0.1.0"
description = "Support-ticket triage agent with guardrails, human approval and evals, built on LangGraph."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Smit Sohagiya" }]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "langgraph>=0.4",
  "langgraph-checkpoint-sqlite>=2.0",
  "opentelemetry-api>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-sdk>=1.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.scripts]
triage = "triage_agent.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PTH", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q --cov=triage_agent --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["triage_agent"]
